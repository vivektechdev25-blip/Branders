<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Flash Prevention: Initialize theme from localStorage before render -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('branderss-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <title>Branderss — Make it bold, make it Branderss | Creative Branding &amp; Digital Growth Agency</title>
    
    <!-- Meta Descriptions & SEO -->
    <meta name="description" content="Branderss creates memorable stories around brands. Strategic branding, social media marketing, SEO, web development, performance ads, and digital growth for 100+ businesses." />
    <meta name="keywords" content="Branding agency, Digital marketing, Social media marketing, SEO, Web development, Performance ads, Creative agency, Lucknow" />
    <meta name="author" content="Branderss" />
    <meta name="theme-color" content="#170A05" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Branderss — Make it bold, make it Branderss" />
    <meta property="og:description" content="We don't just do marketing, we create a story around your brand. Strategic branding, high-conversion web experiences, and digital growth." />
    <meta property="og:site_name" content="Branderss" />
    <meta property="og:image" content="/logo.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Branderss — Make it bold, make it Branderss" />
    <meta name="twitter:description" content="We don't just do marketing, we create a story around your brand." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.branderss.com/" />

    <!-- Google Fonts: Outfit (Display & Headings) & Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
